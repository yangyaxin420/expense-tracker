<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记账小本">
<link rel="manifest" href="manifest.json">
<title>记账小本</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f5f5f5;
  --card: #ffffff;
  --text: #2c2c2c;
  --sub: #999;
  --accent: #5B7FA5;
  --bubble-user: #5B7FA5;
  --bubble-ai: #ffffff;
  --border: #e8e8e8;
  --income: #4CAF50;
  --expense: #E76F51;
  --danger: #E74C3C;
  --warning: #F4A261;
  --nav-height: 56px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --phone-bezel: #1a1a1a;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #e0e0e0;
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

.phone-frame {
  width: 390px;
  height: 844px;
  max-width: 100vw;
  max-height: 100dvh;
  background: var(--bg);
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  box-shadow:
    0 0 0 8px var(--phone-bezel),
    0 0 0 10px #333,
    0 0 40px rgba(0,0,0,0.5),
    inset 0 0 2px rgba(0,0,0,0.05);
}

.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 32px 4px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  flex-shrink: 0;
  user-select: none;
}
.status-bar .time { letter-spacing: 0.5px; }
.status-bar .icons { display: flex; align-items: center; gap: 6px; }
.status-bar .icons svg { width: 14px; height: 14px; }

#app {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 20px 10px;
  flex-shrink: 0;
}
header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: 0.5px;
  color: var(--text);
}
header .header-actions { display: flex; gap: 4px; position: relative; }
header .header-btn {
  width: 32px; height: 32px;
  border: none; background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--sub);
  transition: background 0.15s;
}
header .header-btn:active { background: var(--border); }
header .header-btn svg { width: 20px; height: 20px; stroke: currentColor; }

/* Budget Bar */
#budget-bar-wrap {
  padding: 0 20px 8px;
  flex-shrink: 0;
}
#budget-bar-outer {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
#budget-bar-inner {
  height: 100%;
  border-radius: 3px;
  transition: width 0.4s, background 0.4s;
  background: var(--accent);
}
#budget-bar-inner.warning { background: var(--warning); }
#budget-bar-inner.danger { background: var(--danger); }
#budget-label {
  display: flex;
  justify-content: space-between;
  font-size: 11px;
  color: var(--sub);
  margin-top: 4px;
}
#budget-label .over { color: var(--danger); font-weight: 600; }

/* Panels */
#panels {
  flex: 1;
  overflow: hidden;
  position: relative;
}
.panel {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  overflow: hidden;
}
.panel.active { opacity: 1; pointer-events: auto; }

/* Tab 1: Chat */
#chat-panel { padding: 0 12px; }
#chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 8px 4px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.msg {
  max-width: 82%;
  animation: msgIn 0.25s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.msg.user { align-self: flex-end; }
.msg.ai   { align-self: flex-start; }
.msg .bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
}
.msg.user .bubble {
  background: var(--bubble-user);
  color: #fff;
  border-bottom-right-radius: 6px;
}
.msg.ai .bubble {
  background: var(--bubble-ai);
  color: var(--text);
  border: 1px solid var(--border);
  border-bottom-left-radius: 6px;
}
.msg .meta {
  font-size: 11px;
  color: var(--sub);
  margin-top: 2px;
  padding: 0 4px;
}
.msg.user .meta { text-align: right; }

.typing-dot {
  display: inline-block;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: #ccc;
  margin: 0 1px;
  animation: bounce 1.4s infinite ease-in-out both;
}
.typing-dot:nth-child(1) { animation-delay: 0s; }
.typing-dot:nth-child(2) { animation-delay: 0.16s; }
.typing-dot:nth-child(3) { animation-delay: 0.32s; }
@keyframes bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-6px); }
}

#chat-load-more {
  text-align: center;
  padding: 8px;
}
#chat-load-more button {
  background: none;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 6px 16px;
  font-size: 13px;
  color: var(--accent);
  cursor: pointer;
}

#chat-input-area {
  display: flex;
  gap: 8px;
  padding: 8px 4px calc(8px + var(--safe-bottom));
  flex-shrink: 0;
}
#chat-input-area input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 15px;
  outline: none;
  background: var(--card);
  color: var(--text);
  transition: border-color 0.2s;
}
#chat-input-area input:focus { border-color: var(--accent); }
#chat-send {
  width: 42px; height: 42px;
  border-radius: 50%;
  border: none;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.2s;
}
#chat-send:active { opacity: 0.8; }
#chat-send:disabled { opacity: 0.5; }
#chat-send svg { width: 18px; height: 18px; stroke: #fff; }

/* Tab 2: Pie */
#pie-panel { padding: 0 16px; }
#pie-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 0 12px;
  flex-shrink: 0;
}
#pie-month {
  font-size: 16px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}
#pie-month button {
  background: none; border: none;
  font-size: 18px; cursor: pointer;
  color: var(--accent); padding: 4px 8px;
}
#manage-cat-btn {
  background: none; border: 1px solid var(--border);
  border-radius: 16px; padding: 6px 14px;
  font-size: 13px; color: var(--sub); cursor: pointer;
}
#pie-summary {
  display: flex;
  gap: 12px;
  padding: 0 0 10px;
  flex-shrink: 0;
  font-size: 13px;
}
#pie-summary .summary-item {
  flex: 1;
  background: var(--card);
  border-radius: 12px;
  padding: 10px;
  text-align: center;
}
#pie-summary .summary-item .label { color: var(--sub); font-size: 11px; }
#pie-summary .summary-item .val { font-weight: 700; font-size: 16px; margin-top: 2px; }
#pie-summary .summary-item .val.income { color: var(--income); }
#pie-summary .summary-item .val.expense { color: var(--expense); }
#pie-canvas-wrap {
  flex-shrink: 0;
  height: 200px;
  display: flex;
  align-items: center;
  justify-content: center;
}
#pie-canvas-wrap canvas { max-height: 100%; }
#pie-detail {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
}
.pie-row {
  display: flex;
  align-items: center;
  padding: 9px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.pie-row .dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 10px;
  flex-shrink: 0;
}
.pie-row .name { flex: 1; }
.pie-row .amount { font-weight: 600; }
.pie-row .pct { color: var(--sub); font-size: 12px; margin-left: 6px; }

/* Tab 2-3: Toggle buttons */
.toggle-group { display: flex; gap: 6px; justify-content: center; flex-shrink: 0; }
.toggle-group button {
  border: 1px solid var(--border); background: var(--card); cursor: pointer;
  color: var(--text); transition: all 0.2s;
}
.toggle-group button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

#line-granularity { padding: 4px 0 14px; }
#line-granularity button { padding: 6px 20px; border-radius: 16px; font-size: 14px; }
#line-type-toggle { padding-bottom: 10px; }
#line-type-toggle button, #pie-type-toggle button { padding: 4px 16px; border-radius: 12px; font-size: 13px; }
#pie-type-toggle { padding: 0 0 10px; }
#line-canvas-wrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
#line-canvas-wrap canvas { max-height: 100%; }

/* Tab 4: Records */
#records-panel { padding: 0 16px; }
#records-header {
  display: flex;
  align-items: center;
  padding: 4px 0 8px;
  flex-shrink: 0;
  gap: 6px;
  overflow: hidden;
}
#records-month {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
}
#records-search-btn {
  width: 30px; height: 30px;
  border: none; background: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: var(--sub);
  transition: background 0.15s;
  margin-left: auto;
  flex-shrink: 0;
}
#records-search-btn:active { background: var(--border); }
#records-search-btn.active { color: var(--accent); }
#records-search-btn svg { width: 16px; height: 16px; stroke: currentColor; }
#records-search {
  flex-shrink: 0;
  padding-bottom: 8px;
  overflow: hidden;
  transition: max-height 0.25s ease, opacity 0.2s ease;
  max-height: 0;
  opacity: 0;
}
#records-search.open {
  max-height: 44px;
  opacity: 1;
}
#records-search input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 14px;
  outline: none;
  background: var(--card);
  color: var(--text);
  transition: border-color 0.2s;
}
#records-search input:focus { border-color: var(--accent); }
#records-search input::placeholder { color: #bbb; }
#records-search .clear-btn {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  border: none;
  background: none;
  color: var(--sub);
  font-size: 16px;
  cursor: pointer;
  display: none;
}
#records-month button {
  background: none; border: none;
  font-size: 15px; cursor: pointer;
  color: var(--accent); padding: 2px 4px;
}
#records-summary {
  font-size: 11px;
  color: var(--sub);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex-shrink: 1;
  min-width: 0;
}
#records-summary .in { color: var(--income); font-weight: 600; }
#records-summary .out { color: var(--expense); font-weight: 600; }
#records-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0 8px;
}
.record-item {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  gap: 8px;
  font-size: 14px;
}
.record-item .type-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 10px;
  font-weight: 600;
  flex-shrink: 0;
  color: #fff;
}
.record-item .type-badge.income { background: var(--income); }
.record-item .type-badge.expense { background: var(--expense); }
.record-item .rec-info { flex: 1; min-width: 0; }
.record-item .rec-info .rec-desc { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.record-item .rec-info .rec-meta { font-size: 11px; color: var(--sub); }
.record-item .rec-amount { font-weight: 700; white-space: nowrap; }
.record-item .rec-amount.income { color: var(--income); }
.record-item .rec-amount.expense { color: var(--expense); }
.record-item .rec-actions {
  display: flex;
  gap: 2px;
  flex-shrink: 0;
}
.record-item .rec-actions button {
  width: 28px; height: 28px;
  border: none; background: none;
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--sub);
  font-size: 16px;
}
.record-item .rec-actions button:active { background: var(--border); }
.record-item .rec-actions button.del { color: var(--danger); }

/* Bottom Nav */
nav {
  display: flex;
  height: var(--nav-height);
  padding-bottom: var(--safe-bottom);
  background: rgba(255,255,255,0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
nav .nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: #bbb;
  transition: color 0.2s;
  user-select: none;
}
nav .nav-item.active { color: var(--accent); }
nav .nav-item svg { width: 22px; height: 22px; }
nav .nav-item .label { font-size: 10px; letter-spacing: 0.5px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn 0.2s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal-sheet {
  background: var(--card);
  width: 100%;
  max-width: 420px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(20px + var(--safe-bottom));
  animation: slideUp 0.25s ease-out;
  max-height: 85vh;
  overflow-y: auto;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-sheet h3 { font-size: 17px; margin-bottom: 16px; text-align: center; }
.modal-sheet .form-row {
  display: flex;
  align-items: center;
  margin-bottom: 12px;
  gap: 10px;
}
.modal-sheet .form-row label {
  width: 50px;
  font-size: 14px;
  color: var(--sub);
  flex-shrink: 0;
  text-align: right;
}
.modal-sheet .form-row input,
.modal-sheet .form-row select {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 12px;
  font-size: 14px;
  outline: none;
  background: var(--bg);
  color: var(--text);
}
.modal-sheet .form-row input:focus,
.modal-sheet .form-row select:focus { border-color: var(--accent); }
.modal-sheet .type-toggle {
  display: flex;
  gap: 0;
  border-radius: 10px;
  overflow: hidden;
  border: 1px solid var(--border);
}
.modal-sheet .type-toggle button {
  flex: 1;
  padding: 8px 0;
  border: none;
  font-size: 14px;
  cursor: pointer;
  background: var(--bg);
  color: var(--sub);
  transition: all 0.2s;
}
.modal-sheet .type-toggle button.sel-expense {
  background: var(--expense);
  color: #fff;
}
.modal-sheet .type-toggle button.sel-income {
  background: var(--income);
  color: #fff;
}
.modal-sheet .cat-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 16px;
  background: var(--bg);
  margin: 0 6px 8px 0;
  font-size: 14px;
}
.modal-sheet .cat-tag .del {
  width: 18px; height: 18px;
  border-radius: 50%;
  border: none;
  background: #ddd;
  color: #666;
  font-size: 12px;
  cursor: pointer;
  line-height: 18px;
  text-align: center;
}
.modal-sheet .add-cat-row { display: flex; gap: 8px; margin-top: 12px; }
.modal-sheet .add-cat-row input {
  flex: 1;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 8px 14px;
  font-size: 14px;
  outline: none;
}
.modal-sheet .add-cat-row button {
  border: none;
  background: var(--accent);
  color: #fff;
  border-radius: 18px;
  padding: 8px 18px;
  font-size: 14px;
  cursor: pointer;
}
.modal-close {
  display: block;
  width: 100%;
  margin-top: 14px;
  padding: 10px;
  border: none;
  background: var(--bg);
  border-radius: 12px;
  font-size: 15px;
  cursor: pointer;
  color: var(--text);
}

/* Menu dropdown */
.menu-dropdown {
  position: absolute;
  top: 40px; right: 16px;
  background: var(--card);
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.12);
  z-index: 50;
  overflow: hidden;
  min-width: 140px;
  animation: menuIn 0.15s ease-out;
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
.menu-dropdown button {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 12px 16px;
  border: none;
  background: none;
  font-size: 14px;
  cursor: pointer;
  color: var(--text);
  text-align: left;
}
.menu-dropdown button:active { background: var(--bg); }
.menu-dropdown button svg { width: 18px; height: 18px; stroke: var(--sub); }
.menu-dropdown button.danger { color: var(--danger); }

/* Backup Cards */
.backup-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
  width: 100%; padding: 10px 14px; border: 1px solid var(--border);
  border-radius: 10px; background: var(--card); cursor: pointer;
  font-size: 13px; text-align: left; transition: background .12s;
}
.backup-card:active { background: var(--bg); }
.backup-card.latest { border-color: var(--accent); }
.backup-card .backup-date { font-weight: 600; color: var(--text); }
.backup-card .backup-meta { font-size: 11px; color: var(--sub); }

/* Empty State */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #d0d0d0;
  gap: 8px;
}
.empty-state .empty-icon svg { width: 48px; height: 48px; stroke: #d0d0d0; }
.empty-state .text { font-size: 14px; color: #bbb; }

/* Toast */
#toast {
  position: fixed;
  top: 20px; left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.78);
  color: #fff;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  z-index: 200;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s;
}
#toast.show { opacity: 1; }

/* Hidden file input */
#import-file { display: none; }

@media (max-width: 420px) {
  body { background: var(--bg); }
  .phone-frame {
    width: 100vw; height: 100dvh;
    max-width: 100vw; max-height: 100dvh;
    border-radius: 0;
    box-shadow: none;
  }
  .status-bar { padding: 8px 24px 4px; }
}
</style>
</head>
<body>

<div class="phone-frame">
  <div class="status-bar">
    <span class="time" id="status-time">9:41</span>
    <span style="font-size:10px;color:var(--sub);" id="data-status"></span>
    <span class="icons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="4" width="6" height="4" rx="0.5"/><rect x="9" y="3" width="6" height="6" rx="0.5"/><rect x="17" y="1" width="6" height="10" rx="0.5"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="6" width="18" height="11" rx="2"/><line x1="23" y1="10" x2="23" y2="14"/></svg>
    </span>
  </div>

  <div id="app">
    <header>
      <h1>记账小本</h1>
      <div class="header-actions" style="position:relative">
        <button class="header-btn" id="menu-btn" title="菜单">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
          </svg>
        </button>
      </div>
    </header>

  const json = JSON.stringify(v);

  const size = new Blob([json]).size;
  if (size > 4 * 1024 * 1024) {

const BACKUP_KEY = 'expense_backups';
const MAX_BACKUPS = 10;
let _backupTimer = null;

function getBackups() { return LS(BACKUP_KEY, []); }
function saveBackups(v) { LSset(BACKUP_KEY, v); }

function autoBackup() {
  clearTimeout(_backupTimer);
  _backupTimer = setTimeout(() => {
    const backups = getBackups();
    const snapshot = {
      id: Date.now(),
      time: new Date().toISOString(),
      records: getRecords(),
      categories: getCats(),
      budget: getBudget(),
      chatMessages: getChatMessages()
    };
    backups.unshift(snapshot);
    if (backups.length > MAX_BACKUPS) backups.length = MAX_BACKUPS;
    const ok = LSset(BACKUP_KEY, backups);
    if (!ok && backups.length > 3) {
      // 存不下时缩到 3 份再试
      backups.length = 3;
      LSset(BACKUP_KEY, backups);
    }
  }, 3000);
}

function restoreFromBackup(id) {
  const backups = getBackups();
  const snap = backups.find(b => b.id === id);
  if (!snap) { toast('备份未找到'); return; }
  saveRecords(snap.records || []);
  if (snap.categories) saveCats(snap.categories);
  if (snap.budget !== undefined) saveBudget(snap.budget);
  if (snap.chatMessages) saveChatMessages(snap.chatMessages);
  // Re-render everything

  toast('已恢复 ' + snap.time.slice(0, 10) + ' 的备份');
}

function parseMessage(text) {
  const numMatch = text.match(/\d+(\.\d+)?/);
  const amount = numMatch ? parseFloat(numMatch[0]) : null;
  if (!amount || amount <= 0 || amount > 99999999) return null;

  const type = INCOME_KW.some(kw => text.includes(kw)) ? 'income' : 'expense';

  let category = '其他';
  if (type === 'income') {
    // Income category matching
    const INC_KW_MAP = [
      ['工资', /工资|薪水|月薪|发工资/],
      ['红包', /红包|礼金|份子|压岁|彩礼|聘礼/],
      ['兼职', /兼职|副业|接单|外包|稿费|版税|打赏/],
      ['生活费', /生活费|零花|补贴|家里给|父母给|妈妈给|爸爸给/],
      ['报销', /报销|退款|返现|退费|赔付/],
    ];
    for (const [cat, re] of INC_KW_MAP) {
      if (re.test(text)) { category = cat; break; }
    }
    if (category === '其他') category = '其他收入';
  } else {
    for (const [cat, re] of CAT_KW) {
      if (re.test(text)) { category = cat; break; }
    }
  }

  return { amount, type, category };
}

function getMonthStats() {
  const now = NOW();
  const prefix = monthPrefix(now);
  const records = getRecords().filter(r => r.date && r.date.startsWith(prefix));
  const expenses = records.filter(r => r.type !== 'income');
  const incomes = records.filter(r => r.type === 'income');
  const totalExpense = expenses.reduce((s, r) => s + r.amount, 0);
  const totalIncome = incomes.reduce((s, r) => s + r.amount, 0);

  const cats = getCats();
  const catTotals = {}, catCounts = {};
  cats.forEach(c => { catTotals[c] = 0; catCounts[c] = 0; });
  expenses.forEach(r => {
    const cat = cats.includes(r.category) ? r.category : '其他';
    catTotals[cat] = (catTotals[cat] || 0) + r.amount;
    catCounts[cat] = (catCounts[cat] || 0) + 1;
  });
  return { totalExpense, totalIncome, catTotals, catCounts, recordCount: records.length, expenses, incomes };
}

function buildSystemPrompt() {
  const s = getMonthStats();
  const budget = getBudget();
  const topCats = Object.entries(s.catTotals).filter(([,v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 5);

  let summary = `- 本月总支出：¥${s.totalExpense.toFixed(2)}，总收入：¥${s.totalIncome.toFixed(2)}\n`;
  if (budget > 0) summary += `- 月度预算：¥${budget.toFixed(2)}，已使用 ${((s.totalExpense/budget)*100).toFixed(0)}%\n`;
  if (topCats.length) summary += `- 支出Top${topCats.length}：${topCats.map(([c,v]) => `${c} ¥${v.toFixed(0)}`).join('、')}\n`;
  const details = ['零食','水果','餐饮','日用'].filter(c => s.catTotals[c] > 0)
    .map(c => `${c} ${s.catCounts[c]}次 ¥${s.catTotals[c].toFixed(0)}`);
  if (details.length) summary += `- 明细：${details.join('；')}`;

  // 静态前缀在前（可缓存）+ 动态数据在后（每次更新）
  return STATIC_SYSTEM_PROMPT.replace('${cats}', getCats().join('、'))
    + '\n\n## 对方本月的财务状况（仅供你参考，不要在回复中逐条念出来）\n' + summary;
}

async function callAI(userMsg) {
  const recentMsgs = getChatMessages().slice(-20);
  const messages = [
    { role: 'system', content: buildSystemPrompt() },
    ...recentMsgs.map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.text }))
  ];

  const resp = await fetch('https://api.deepseek.com/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + getApiKey()
    },
    body: JSON.stringify({
      model: 'deepseek-chat',
      messages: messages,
      temperature: 0.8,
      max_tokens: 200
    })
  });
  if (!resp.ok) {
    const err = await resp.text();
    throw new Error('API请求失败: ' + resp.status + ' ' + err);
  }
  const data = await resp.json();
  return data.choices[0].message.content.trim();
}

  const el = document.getElementById('toast');

  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ══════════════════════════════════════════
   TAB 1: CHAT
   ══════════════════════════════════════════ */

const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const chatSend = document.getElementById('chat-send');
let isSending = false;
const CHAT_PAGE_SIZE = 50;
let chatOffset = 0;

chatSend.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function addMsg(role, text, meta, prepend) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>${meta ? `<div class="meta">${meta}</div>` : ''}`;
  if (prepend) chatMessages.insertBefore(div, chatMessages.firstChild);
  else { chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight; }
  return div;
}

function addAIMsg(text, time) {
  addMsg('ai', text, time);
  const msgs = getChatMessages();
  msgs.push({ role: 'ai', text, time, date: fmtDate(NOW()) });
  saveChatMessages(msgs);
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing-msg';
  div.innerHTML = '<div class="bubble"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTyping() { const el = document.getElementById('typing-msg'); if (el) el.remove(); }

async function sendMessage() {
  const text = chatInput.value.trim();
  if (!text || isSending) return;

  // 没有API Key → 弹出设置框
  if (!getApiKey()) {
    toast('请先设置 API Key');
    showApiKeyModal();
    return;
  }
  isSending = true;
  chatSend.disabled = true;
  chatInput.value = '';

  const now = NOW();
  const timeStr = fmtTime(now), dateStr = fmtDate(now);
  addMsg('user', text, timeStr);

  const chatMsgs = getChatMessages();
  chatMsgs.push({ role: 'user', text, time: timeStr, date: dateStr });
  saveChatMessages(chatMsgs);

  // Local parse → save record
  const parsed = parseMessage(text);
  if (parsed) {
    const records = getRecords();
    records.unshift({
      id: Date.now(),
      type: parsed.type, amount: parsed.amount, category: parsed.category,
      item: text.replace(/\d+(\.\d+)?/g, '').replace(/[，,。.！!？?\s]+/g, ' ').trim().slice(0, 30) || text.slice(0, 20),
      date: dateStr, time: timeStr
    });
    saveRecords(records);
    updateBudgetBar();
    updateDataStatus();
    toast('✅ 已记录 · 共 ' + records.length + ' 笔');
  }

  // AI reply
  addTyping();
  try {
    const reply = await callAI(text);
    removeTyping();
    addAIMsg(reply, timeStr);
    checkBudgetWarning();
  } catch (err) {
    removeTyping();
    console.error(err);
    addMsg('ai', '……信号不好，再说一遍。', timeStr);
  }

  isSending = false;
  chatSend.disabled = false;
  chatInput.focus();
}

function checkBudgetWarning() {
  const budget = getBudget();
  if (budget <= 0) return;
  const now = NOW();
  const monthKey = monthPrefix(now);
  const totalExpense = getRecords().filter(r => r.date && r.date.startsWith(monthKey) && r.type !== 'income')
    .reduce((s, r) => s + r.amount, 0);
  const pct = totalExpense / budget;

  const warnKey = 'budget_warn_state';
  let warnState = LS('budget_warn_state', {});
  if (warnState.month !== monthKey) warnState = { month: monthKey, level: 0 };

  if (pct >= 1.0 && warnState.level < 2) {
    warnState.level = 2;
    LSset(warnKey, warnState);
    setTimeout(() => addAIMsg(`⚠️ 这个月已经花了 ¥${totalExpense.toFixed(0)}，超出预算了。……你最好有合理的解释。`, fmtTime(NOW())), 600);
  } else if (pct >= 0.8 && warnState.level < 1) {
    warnState.level = 1;
    LSset(warnKey, warnState);
    setTimeout(() => addAIMsg(`📊 本月支出已达预算的 ${(pct*100).toFixed(0)}%，注意点。`, fmtTime(NOW())), 600);
  }
}

/* ══════════════════════════════════════════
   MEMORY / MONTHLY SUMMARY
   ══════════════════════════════════════════ */

function checkAndShowSummary() {
  const now = NOW();
  const today = fmtDate(now), monthKey = monthPrefix(now);
  let lastCheck = LS('last_summary_check', {});
  const daysSince = lastCheck.date ? Math.floor((new Date(today) - new Date(lastCheck.date)) / 86400000) : 999;

  if (lastCheck.month === monthKey && daysSince < 3) return;

  const s = getMonthStats();
  if (s.recordCount === 0) return;

  LSset('last_summary_check', { month: monthKey, date: today });

  const parts = [];
  if (s.catTotals['零食'] > 0) parts.push(`零食买了${s.catCounts['零食']}次，花了¥${s.catTotals['零食'].toFixed(0)}`);
  if (s.catTotals['水果'] > 0) parts.push(`水果买了${s.catCounts['水果']}次，花了¥${s.catTotals['水果'].toFixed(0)}`);
  if (s.catTotals['餐饮'] > 0) parts.push(`吃饭¥${s.catTotals['餐饮'].toFixed(0)}`);
  if (s.catTotals['日用'] > 0) parts.push(`日用品¥${s.catTotals['日用'].toFixed(0)}`);
  if (parts.length === 0) return;

  let msg = `📋 这个月到现在花了 ¥${s.totalExpense.toFixed(0)}`;
  if (s.totalIncome > 0) msg += `，收入 ¥${s.totalIncome.toFixed(0)}`;
  msg += `。\n${parts.join('；')}。`;

  if (s.catTotals['零食'] > 300) msg += `\n……零食是不是买太多了？`;
  else if (s.catTotals['水果'] === 0 && s.catTotals['零食'] > 0) msg += `\n光吃零食不吃水果，你是小孩子吗。`;

  setTimeout(() => addAIMsg(msg, fmtTime(NOW())), 1500);
}

function triggerManualSummary() {
  localStorage.removeItem('last_summary_check');
  localStorage.removeItem('budget_warn_state');
  checkAndShowSummary();
}

function loadChatHistory() {
  const allMsgs = getChatMessages();
  chatMessages.innerHTML = '';
  chatOffset = 0;

  if (allMsgs.length === 0) { addMsg('ai', '花了什么钱，说。', '记账小本'); return; }

  const start = Math.max(0, allMsgs.length - CHAT_PAGE_SIZE);
  chatOffset = start;

  if (start > 0) {
    const loadMoreDiv = document.createElement('div');
    loadMoreDiv.id = 'chat-load-more';
    loadMoreDiv.innerHTML = `<button>↑ 加载更早的消息 (${start} 条)</button>`;
    loadMoreDiv.querySelector('button').addEventListener('click', loadMoreChat);
    chatMessages.appendChild(loadMoreDiv);
  }

  for (let i = start; i < allMsgs.length; i++) {
    const m = allMsgs[i];
    addMsg(m.role === 'ai' ? 'ai' : 'user', m.text, m.time);
  }
}

function loadMoreChat() {
  const allMsgs = getChatMessages();
  if (chatOffset <= 0) { const el = document.getElementById('chat-load-more'); if (el) el.remove(); return; }

  const newStart = Math.max(0, chatOffset - CHAT_PAGE_SIZE);
  const oldScrollHeight = chatMessages.scrollHeight;

  for (let i = newStart; i < chatOffset; i++) {
    const m = allMsgs[i];
    addMsg(m.role === 'ai' ? 'ai' : 'user', m.text, m.time, true);
  }

  chatOffset = newStart;
  requestAnimationFrame(() => { chatMessages.scrollTop = chatMessages.scrollHeight - oldScrollHeight; });

  const el = document.getElementById('chat-load-more');
  if (newStart <= 0) { if (el) el.remove(); }
  else if (el) el.querySelector('button').textContent = `↑ 加载更早的消息 (${newStart} 条)`;
}

   ══════════════════════════════════════════ */

function updateBudgetBar() {
  const budget = getBudget();
  const s = getMonthStats();
  const inner = document.getElementById('budget-bar-inner');
  const text = document.getElementById('budget-text');
  inner.classList.remove('warning', 'danger');
  text.classList.remove('over');

  if (budget <= 0) { inner.style.width = '0%'; text.textContent = '未设置'; return; }

  const pct = Math.min((s.totalExpense / budget) * 100, 100);
  inner.style.width = pct + '%';

  if (pct >= 100) {
    inner.classList.add('danger');
    text.textContent = `¥${s.totalExpense.toFixed(0)} / ¥${budget} (已超支!)`;
    text.classList.add('over');
  } else if (pct >= 80) {
    inner.classList.add('warning');
    text.textContent = `¥${s.totalExpense.toFixed(0)} / ¥${budget} (${pct.toFixed(0)}%)`;
  } else {
    text.textContent = `¥${s.totalExpense.toFixed(0)} / ¥${budget} (${pct.toFixed(0)}%)`;
  }
}

   TAB 2: PIE CHART
   ══════════════════════════════════════════ */

let pieChart = null;
let pieYear = new Date().getFullYear();
let pieMonth = new Date().getMonth() + 1;
let pieType = 'expense'; // 'expense' or 'income'

document.querySelectorAll('#pie-type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#pie-type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    pieType = btn.dataset.ptype;
    renderPie();
  });
});

document.getElementById('pie-prev').addEventListener('click', () => {
  pieMonth--; if (pieMonth < 1) { pieMonth = 12; pieYear--; }
  renderPie();
});
document.getElementById('pie-next').addEventListener('click', () => {
  const now = new Date();
  if (pieYear === now.getFullYear() && pieMonth === now.getMonth() + 1) return;
  pieMonth++; if (pieMonth > 12) { pieMonth = 1; pieYear++; }
  renderPie();
});

function renderPie() {
  const ym = `${pieYear}年${pieMonth}月`;
  document.getElementById('pie-month-label').textContent = ym;

  const records = getRecords();
  const prefix = `${pieYear}-${String(pieMonth).padStart(2, '0')}`;
  const monthRecords = records.filter(r => r.date && r.date.startsWith(prefix));

  const expenses = monthRecords.filter(r => r.type !== 'income');
  const incomes = monthRecords.filter(r => r.type === 'income');
  const totalExpense = expenses.reduce((s, r) => s + r.amount, 0);
  const totalIncome = incomes.reduce((s, r) => s + r.amount, 0);

  document.getElementById('pie-total-expense').textContent = '¥' + totalExpense.toFixed(0);
  document.getElementById('pie-total-income').textContent = '¥' + totalIncome.toFixed(0);

  // Determine which data to show based on pieType toggle
  const isIncome = pieType === 'income';
  const targetRecords = isIncome ? incomes : expenses;
  const targetTotal = isIncome ? totalIncome : totalExpense;
  const cats = getCats();
  const incomeCats = DEFAULT_INCOME_CATS;

  const totals = {};
  if (isIncome) {
    incomeCats.forEach(c => totals[c] = 0);
  } else {
    cats.forEach(c => totals[c] = 0);
  }
  targetRecords.forEach(r => {
    let cat = '其他';
    if (isIncome) {
      cat = incomeCats.includes(r.category) ? r.category : '其他收入';
    } else {
      cat = cats.includes(r.category) ? r.category : '其他';
    }
    totals[cat] = (totals[cat] || 0) + r.amount;
  });

  const entries = Object.entries(totals).filter(([,v]) => v > 0);

  if (pieChart) { pieChart.destroy(); pieChart = null; }
  const ctx = document.getElementById('pie-canvas').getContext('2d');

  const emptyLabel = isIncome ? '本月暂无收入记录' : '本月暂无支出记录';

  if (entries.length === 0) {
    document.getElementById('pie-detail').innerHTML = `<div class="empty-state"><span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg></span><span class="text">${emptyLabel}</span></div>`;
    return;
  }

  pieChart = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: entries.map(([c]) => c),
      datasets: [{
        data: entries.map(([,v]) => v),
        backgroundColor: entries.map(([c]) => getColorForCat(c)),
        borderWidth: 2,
        borderColor: '#fff'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: { legend: { display: false } }
    }
  });

  document.getElementById('pie-detail').innerHTML = entries
    .sort((a, b) => b[1] - a[1])
    .map(([cat, amt]) => {
      const pct = targetTotal > 0 ? ((amt / targetTotal) * 100).toFixed(1) : 0;
      return `<div class="pie-row">
        <span class="dot" style="background:${getColorForCat(cat)}"></span>
        <span class="name">${cat}</span>
        <span class="amount">¥${amt.toFixed(2)}</span>
        <span class="pct">${pct}%</span>
      </div>`;
    }).join('');
}

/* ══════════════════════════════════════════
   TAB 3: LINE CHART
   ══════════════════════════════════════════ */

let lineChart = null;
let lineGran = 'week';
let lineType = 'expense';

document.querySelectorAll('#line-granularity button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#line-granularity button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    lineGran = btn.dataset.gran;
    renderLine();
  });
});

document.querySelectorAll('#line-type-toggle button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#line-type-toggle button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    lineType = btn.dataset.ltype;
    renderLine();
  });
});

function renderLine() {
  const records = getRecords();

  if (lineChart) { lineChart.destroy(); lineChart = null; }

  let labels, data;

  if (lineGran === 'week') {
    labels = []; data = [];
    for (let i = 6; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const ds = d.toISOString().split('T')[0];
      const subset = records.filter(r => r.date === ds && (lineType === 'income' ? r.type === 'income' : r.type !== 'income'));
      data.push(subset.reduce((s, r) => s + r.amount, 0));
      labels.push((d.getMonth() + 1) + '/' + d.getDate());
    }
  } else if (lineGran === 'month') {
    labels = []; data = [];
    for (let i = 5; i >= 0; i--) {
      const d = new Date();
      d.setMonth(d.getMonth() - i);
      const prefix = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
      const subset = records.filter(r => r.date && r.date.startsWith(prefix) && (lineType === 'income' ? r.type === 'income' : r.type !== 'income'));
      data.push(subset.reduce((s, r) => s + r.amount, 0));
      labels.push((d.getMonth() + 1) + '月');
    }
  } else {
    labels = []; data = [];
    const years = new Set(records.map(r => (r.date || '').slice(0, 4)).filter(Boolean));
    const sorted = Array.from(years).sort();
    const last5 = sorted.slice(-5);
    if (last5.length === 0) last5.push(new Date().getFullYear().toString());
    for (const y of last5) {
      const subset = records.filter(r => r.date && r.date.startsWith(y) && (lineType === 'income' ? r.type === 'income' : r.type !== 'income'));
      data.push(subset.reduce((s, r) => s + r.amount, 0));
      labels.push(y + '年');
    }
  }

  const hasData = data.some(v => v > 0);
  if (!hasData) return;

  const isIncome = lineType === 'income';
  const color = isIncome ? '#4CAF50' : '#E76F51';

  const ctx = document.getElementById('line-canvas').getContext('2d');
  lineChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: isIncome ? '收入 (¥)' : '支出 (¥)',
        data,
        borderColor: color,
        backgroundColor: isIncome ? 'rgba(76,175,80,0.08)' : 'rgba(231,111,81,0.08)',
        fill: true,
        tension: 0.35,
        pointRadius: 4,
        pointBackgroundColor: color,
        borderWidth: 2
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { callback: v => '¥' + v } }
      }
    }
  });
}

/* ══════════════════════════════════════════
   TAB 4: RECORDS
   ══════════════════════════════════════════ */

let recYear = new Date().getFullYear();
let recMonth = new Date().getMonth() + 1;

document.getElementById('rec-prev').addEventListener('click', () => {
  recMonth--; if (recMonth < 1) { recMonth = 12; recYear--; }
  renderRecords();
});
document.getElementById('rec-next').addEventListener('click', () => {
  const now = new Date();
  if (recYear === now.getFullYear() && recMonth === now.getMonth() + 1) return;
  recMonth++; if (recMonth > 12) { recMonth = 1; recYear++; }
  renderRecords();
});

function renderRecords(keyword) {
  const prefix = `${recYear}-${String(recMonth).padStart(2, '0')}`;
  document.getElementById('rec-month-label').textContent = `${recYear}年${recMonth}月`;

  const records = getRecords();
  let monthRecords = records.filter(r => r.date && r.date.startsWith(prefix));

  // 搜索筛选
  const kw = (keyword || '').trim().toLowerCase();
  const clearBtn = document.getElementById('records-search-clear');
  const searchInput = document.getElementById('records-search-input');
  if (kw) {
    monthRecords = monthRecords.filter(r =>
      (r.category || '').toLowerCase().includes(kw) ||
      (r.item || '').toLowerCase().includes(kw)
    );
    clearBtn.style.display = 'block';
  } else {
    clearBtn.style.display = 'none';
  }

  const te = monthRecords.filter(r => r.type !== 'income').reduce((s, r) => s + r.amount, 0);
  const ti = monthRecords.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  document.getElementById('records-summary').innerHTML = `收入 <span class="in">¥${ti.toFixed(0)}</span> · 支出 <span class="out">¥${te.toFixed(0)}</span>`;

  const list = document.getElementById('records-list');
  if (monthRecords.length === 0) {
    list.innerHTML = `<div class="empty-state"><span class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="15" x2="12" y2="15"/></svg></span><span class="text">${kw ? '没有匹配的记录' : '本月暂无记录'}</span></div>`;
    return;
  }

  list.innerHTML = monthRecords.map(r => {
    const isInc = r.type === 'income';
    return `<div class="record-item" data-id="${r.id}">
      <span class="type-badge ${isInc ? 'income' : 'expense'}">${isInc ? '收入' : '支出'}</span>
      <div class="rec-info">
        <div class="rec-desc">${escapeHtml(r.item || '无备注')}</div>
        <div class="rec-meta">${r.date || ''} · ${escapeHtml(r.category)}</div>
      </div>
      <span class="rec-amount ${isInc ? 'income' : 'expense'}">${isInc ? '+' : '-'}¥${r.amount.toFixed(2)}</span>
      <div class="rec-actions">
        <button class="edit" title="编辑" data-id="${r.id}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
        <button class="del" title="删除" data-id="${r.id}">×</button>
      </div></div>`;
  }).join('');

  list.querySelectorAll('.edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const rec = records.find(r => r.id === parseInt(btn.dataset.id));
      if (rec) showEditModal(rec);
    });
  });
  list.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', () => {
      const rec = records.find(r => r.id === parseInt(btn.dataset.id));
      if (rec) confirmDelete(rec);
    });
  });
}

/* ══════════════════════════════════════════
   EDIT MODAL
   ══════════════════════════════════════════ */

function showEditModal(record) {
  removeExistingModal();
  const isIncomeInit = record.type === 'income';
  const expenseCats = getCats();
  const getCatsForType = (isInc) => isInc ? DEFAULT_INCOME_CATS : expenseCats;
  const cats = getCatsForType(isIncomeInit);

  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet">
      <h3>编辑记录</h3>
      <div class="form-row">
        <label>类型</label>
        <div class="type-toggle" style="flex:1">
          <button id="edit-type-expense" class="${!isIncomeInit ? 'sel-expense' : ''}">支出</button>
          <button id="edit-type-income" class="${isIncomeInit ? 'sel-income' : ''}">收入</button>
        </div>
      </div>
      <div class="form-row">
        <label>金额</label>
        <input type="number" id="edit-amount" value="${record.amount}" step="0.01" min="0">
      </div>
      <div class="form-row">
        <label>类别</label>
        <select id="edit-category" style="flex:1">${cats.map(c => `<option value="${c}" ${record.category === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
      </div>
      <div class="form-row">
        <label>备注</label>
        <input type="text" id="edit-item" value="${escapeHtml(record.item || '')}" maxlength="50" style="flex:1">
      </div>
      <div class="form-row">
        <label>日期</label>
        <input type="date" id="edit-date" value="${record.date || ''}" style="flex:1">
      </div>
      <button class="modal-close" id="save-edit" style="background:var(--accent);color:#fff;">保存</button>
      <button class="modal-close" id="cancel-edit">取消</button>
    </div>
  `;
  document.body.appendChild(overlay);

  let editType = record.type || 'expense';

  function updateCategorySelect(isInc) {
    const sel = overlay.querySelector('#edit-category');
    const newCats = getCatsForType(isInc);
    const currentVal = sel.value;
    sel.innerHTML = newCats.map(c => `<option value="${c}" ${currentVal === c ? 'selected' : ''}>${c}</option>`).join('');
    // If current value not in new list, select first
    if (!newCats.includes(currentVal)) {
      sel.value = newCats[0];
    }
  }

  overlay.querySelector('#edit-type-expense').addEventListener('click', function() {
    editType = 'expense';
    this.classList.add('sel-expense');
    overlay.querySelector('#edit-type-income').classList.remove('sel-income');
    updateCategorySelect(false);
  });
  overlay.querySelector('#edit-type-income').addEventListener('click', function() {
    editType = 'income';
    this.classList.add('sel-income');
    overlay.querySelector('#edit-type-expense').classList.remove('sel-expense');
    updateCategorySelect(true);
  });

  overlay.querySelector('#save-edit').addEventListener('click', () => {
    const amount = parseFloat(overlay.querySelector('#edit-amount').value);
    if (isNaN(amount) || amount <= 0) { toast('金额无效'); return; }

    const records = getRecords();
    const idx = records.findIndex(r => r.id === record.id);
    if (idx === -1) { overlay.remove(); return; }

    records[idx].type = editType;
    records[idx].amount = amount;
    records[idx].category = overlay.querySelector('#edit-category').value;
    records[idx].item = overlay.querySelector('#edit-item').value.trim() || record.item;
    records[idx].date = overlay.querySelector('#edit-date').value || record.date;
    saveRecords(records);

    overlay.remove();
    toast('记录已更新');
    renderRecords();
    renderPie();
    renderLine();
    updateBudgetBar();
  });

  overlay.querySelector('#cancel-edit').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function confirmDelete(record) {
  showAlertModal('确认删除',
    `${record.type === 'income' ? '收入' : '支出'} · ${escapeHtml(record.category)} · ¥${record.amount.toFixed(2)}\n${escapeHtml(record.item || '')}`,
    '确认删除', 'var(--danger)',
    () => {
      saveRecords(getRecords().filter(r => r.id !== record.id));
      toast('记录已删除');
      renderRecords(); renderPie(); renderLine(); updateBudgetBar();
    });
}

/* ══════════════════════════════════════════
   EXPORT / IMPORT
   ══════════════════════════════════════════ */

function exportData() {
  const data = {
    version: 2,
    exportedAt: new Date().toISOString(),
    records: getRecords(),
    categories: getCats(),
    budget: getBudget(),
    chatMessages: getChatMessages()
  };
  const json = JSON.stringify(data, null, 2);
  const filename = `记账备份_${new Date().toISOString().split('T')[0]}.json`;

  // 方案1: Web Share API（移动端最可靠）
  if (navigator.share) {
    const file = new File([json], filename, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '记账备份' })
        .then(() => toast('✅ 数据已导出'))
        .catch(() => {}); // 用户取消分享不提示
      return;
    }
  }

  // 方案2: 复制到剪贴板 + 显示内容（100% 可靠）
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.style.cssText = 'display:flex;';
  overlay.innerHTML = `
    <div class="modal-sheet" style="max-height:80vh;display:flex;flex-direction:column;">
      <h3 style="margin-bottom:4px;">导出数据</h3>
      <p style="font-size:12px;color:var(--sub);margin-bottom:8px;">复制下方全部内容，保存为 .json 文件</p>
      <textarea style="flex:1;width:100%;min-height:200px;font-size:11px;font-family:monospace;padding:8px;border:1px solid var(--border);border-radius:8px;resize:none;" readonly>${json.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>
      <div style="display:flex;gap:6px;margin-top:8px;">
        <button id="export-copy-btn" style="flex:1;padding:10px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;">复制全部</button>
        <button id="export-close-btn" style="flex:1;padding:10px;background:#f0f0f0;color:var(--text);border:none;border-radius:8px;font-size:14px;">关闭</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.querySelector('#export-copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(json).then(() => {
      toast('✅ 已复制，请粘贴到文件中保存');
    }).catch(() => {
      // 如果剪贴板不行，让用户手动选
      const ta = overlay.querySelector('textarea');
      ta.select(); ta.setSelectionRange(0, json.length);
      toast('请手动复制');
    });
  });
  overlay.querySelector('#export-close-btn').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.records || !Array.isArray(data.records)) throw new Error('格式错误');

      const existing = getRecords();
      const existingIds = new Set(existing.map(r => r.id));
      let added = 0;
      for (const r of data.records) {
        if (!existingIds.has(r.id)) {
          if (!r.type) r.type = 'expense';
          existing.push(r);
          added++;
        }
      }
      existing.sort((a, b) => b.id - a.id);
      saveRecords(existing);

      if (data.categories && Array.isArray(data.categories)) {
        const currentCats = getCats();
        for (const c of data.categories) {
          if (!currentCats.includes(c)) currentCats.push(c);
        }
        saveCats(currentCats);
      }

      if (data.budget !== undefined) {
        saveBudget(data.budget);
      }

      if (data.chatMessages && Array.isArray(data.chatMessages)) {
        const existingChat = getChatMessages();
        const existingTexts = new Set(existingChat.map(m => m.role + '|' + m.text + '|' + m.time));
        let chatAdded = 0;
        for (const m of data.chatMessages) {
          const key = (m.role || 'user') + '|' + (m.text || '') + '|' + (m.time || '');
          if (!existingTexts.has(key)) {
            existingChat.push(m);
            existingTexts.add(key);
            chatAdded++;
          }
        }
        saveChatMessages(existingChat);
        toast(`导入完成，新增 ${added} 条记录、${chatAdded} 条消息`);
      } else {
        toast(`导入完成，新增 ${added} 条记录`);
      }

      loadChatHistory();
      renderPie();
      renderLine();
      renderRecords();
      updateBudgetBar();
    } catch (err) {
      toast('文件格式不正确');
      console.error(err);
    }
  };
  reader.readAsText(file);
}

/* ─── 恢复备份 ─── */
function showRestoreModal() {
  const backups = getBackups();
  if (!backups.length) { toast('暂无备份'); return; }
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet" style="max-height:70vh;display:flex;flex-direction:column;">
      <h3 style="margin-bottom:4px;">恢复备份</h3>
      <p style="font-size:12px;color:var(--sub);margin-bottom:12px;">每次记账后自动备份，保留最近 ${MAX_BACKUPS} 份</p>
      <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;" id="backup-list"></div>
      <button class="modal-close" id="backup-cancel" style="margin-top:10px;background:#f0f0f0;color:var(--text);">取消</button>
    </div>`;
  document.body.appendChild(overlay);

  const list = overlay.querySelector('#backup-list');
  backups.forEach((b, i) => {
    const d = new Date(b.time);
    const label = d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const count = (b.records || []).length;
    const chatCount = (b.chatMessages || []).length;
    const card = document.createElement('button');
    card.className = 'backup-card' + (i === 0 ? ' latest' : '');
    card.innerHTML = `
      <span class="backup-date">${label}${i === 0 ? ' <em style="font-style:normal;color:var(--accent);font-size:11px;">最新</em>' : ''}</span>
      <span class="backup-meta">${count} 条记录 · ${chatCount} 条消息</span>`;
    card.addEventListener('click', () => {
      overlay.remove();
      showConfirmRestore(b.id, label);
    });
    list.appendChild(card);
  });

  overlay.querySelector('#backup-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

function showConfirmRestore(id, label) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal-sheet" style="text-align:center;">
      <h3 style="margin-bottom:8px;">确认恢复</h3>
      <p style="font-size:14px;color:var(--sub);margin-bottom:16px;">将替换当前所有数据为 <strong>${label}</strong> 的状态</p>
      <div style="display:flex;gap:8px;">
        <button class="modal-close" id="restore-confirm" style="flex:1;background:var(--warning);color:#fff;">恢复</button>
        <button class="modal-close" id="restore-cancel" style="flex:1;background:#f0f0f0;color:var(--text);">取消</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#restore-confirm').addEventListener('click', () => { overlay.remove(); restoreFromBackup(id); });
  overlay.querySelector('#restore-cancel').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
}

document.getElementById('import-file').addEventListener('change', function() {
  if (this.files[0]) {
    importData(this.files[0]);
    this.value = '';
  }
});

/* ══════════════════════════════════════════
   INIT
   ══════════════════════════════════════════ */

function init() {
  loadChatHistory();
  updateBudgetBar();
  renderPie();
  renderLine();
  // 搜索按钮：展开/收起
  const searchBtn = document.getElementById('records-search-btn');
  const searchWrap = document.getElementById('records-search');
  if (searchBtn && searchWrap) {
    searchBtn.addEventListener('click', () => {
      const isOpen = searchWrap.classList.toggle('open');
      searchBtn.classList.toggle('active', isOpen);
      if (isOpen) setTimeout(() => document.getElementById('records-search-input').focus(), 250);
    });
  }
  // 记录搜索事件（防抖）
  let _searchTimer = null;
  const searchInput = document.getElementById('records-search-input');
  const clearBtn = document.getElementById('records-search-clear');
  if (searchInput) {
    searchInput.addEventListener('input', () => {
      clearTimeout(_searchTimer);
      _searchTimer = setTimeout(() => renderRecords(searchInput.value), 200);
    });
    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        renderRecords('');
        searchInput.focus();
      });
    }
  }
  // Periodic summary check (3+ day interval)
  checkAndShowSummary();
  // 没配API Key → 弹设置框
  if (!getApiKey()) { showApiKeyModal(); }
}

init();
